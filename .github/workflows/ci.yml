
name: DevOps AWS API - CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Docker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: devpos-aws-api

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: devpos-aws-api/pom.xml

      - name: Compilar e executar testes
        run: mvn -B clean verify

      - name: Construir imagem Docker
        run: docker build -t devops-aws-api:1.0 .

      - name: Verificar imagem Docker
        run: docker images
